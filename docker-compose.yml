# One-command local stack:  cp .env.example .env  (set JWT_SECRET)  &&  docker compose up --build
#   (set POSTGRES_PASSWORD too)
#   web  -> http://localhost:8080
#   api  -> http://localhost:8000/healthz
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_DB: tms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      # The API applies pending database migrations on start (see backend/Dockerfile).
      DATABASE_URL: postgresql://tms:${POSTGRES_PASSWORD}@postgres:5432/tms?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CLIENT_ORIGINS: http://localhost:8080
      # The compose stack is served over plain HTTP; drop this line when you put it behind HTTPS.
      COOKIE_SECURE: "false"
      CLOUDINARY_CLOUDNAME: ${CLOUDINARY_CLOUDNAME:-}
      CLOUDINARY_APIKEY: ${CLOUDINARY_APIKEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
