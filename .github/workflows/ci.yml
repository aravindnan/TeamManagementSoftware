name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: tms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tms -d tms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests wipe this database; it only exists for the duration of the job.
      TEST_DATABASE_URL: postgresql://tms:ci-only-throwaway@localhost:5432/tms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Fails if the committed migrations no longer match prisma/schema.prisma.
      - name: Check migrations are in sync with the schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$TEST_DATABASE_URL" --exit-code
      - run: npm test

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit and component tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: Production build
        run: npm run build
        env:
          CI: "true"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-used-at-runtime
          POSTGRES_PASSWORD: ci-only-placeholder-not-used-at-runtime
      - name: Build API image
        run: docker build ./backend
      - name: Build web image
        run: docker build ./frontend
