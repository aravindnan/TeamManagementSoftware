name: Deploy

# Runs only after CI succeeded on main. All credentials come from GitHub Actions secrets (Settings > Secrets
# and variables > Actions); nothing sensitive lives in the repository. See docs/DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    name: API to Render
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Sync environment to Render and deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGINS: ${{ secrets.APP_URL }}
          PUBLIC_CLIENT_URL: ${{ secrets.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLOUDINARY_CLOUDNAME: ${{ secrets.CLOUDINARY_CLOUDNAME }}
          CLOUDINARY_APIKEY: ${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          for v in RENDER_API_KEY RENDER_SERVICE_ID DATABASE_URL JWT_SECRET CLIENT_ORIGINS; do
            [ -n "${!v}" ] || { echo "::error::Missing GitHub secret for $v"; exit 1; }
          done
          # Only these keys are managed from GitHub; the PUT replaces the service's variables with exactly this set.
          body=$(jq -n \
            --arg NODE_ENV production --arg TRUST_PROXY_HOPS 2 --arg COOKIE_SAMESITE lax \
            --arg DATABASE_URL "$DATABASE_URL" --arg JWT_SECRET "$JWT_SECRET" \
            --arg CLIENT_ORIGINS "$CLIENT_ORIGINS" --arg PUBLIC_CLIENT_URL "$PUBLIC_CLIENT_URL" \
            --arg GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" --arg CLOUDINARY_CLOUDNAME "$CLOUDINARY_CLOUDNAME" \
            --arg CLOUDINARY_APIKEY "$CLOUDINARY_APIKEY" --arg CLOUDINARY_API_SECRET "$CLOUDINARY_API_SECRET" \
            '$ARGS.named | to_entries | map(select(.value != "")) | map({key, value})')
          curl -fsS -X PUT "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "$body" > /dev/null
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Deploy triggered. Migrations run automatically when the container starts."

  web:
    name: Web to Vercel
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Same-origin proxy (see vercel.json): the browser only ever talks to the web domain, so cookies stay first-party.
      REACT_APP_API_URL: /api
      REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes vercel@65 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@65 build --prod --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@65 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
